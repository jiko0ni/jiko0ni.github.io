<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#111111"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="BingoFriends"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
  <title>BingoFriends</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, Arial; margin: 0; background: #f5f3eb; text-align: center; min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }
    h1 { margin: 20px; }
    .view { display: none; }
    .view.active { display: block; }
    input, select { padding: 10px; border-radius: 10px; border: none; margin: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); background: white; }
    button { padding: 10px 14px; border-radius: 10px; border: none; background: #111; color: white; cursor: pointer; margin: 6px; }
    .board-list { margin-top: 20px; }
    .board-item { display: flex; justify-content: space-between; align-items: center; background: white; padding: 12px; margin: 8px auto; width: 340px; border-radius: 14px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .board-actions { display: flex; gap: 8px; }
    .icon-btn { background: transparent; border: none; cursor: pointer; padding: 6px; }
    .icon-btn svg { width: 20px; height: 20px; stroke: #444; stroke-width: 2; fill: none; transition: 0.2s; }
    .view-btn:hover svg { stroke: #3b82f6; }
    .edit-btn:hover svg { stroke: #f59e0b; }
    .delete-btn:hover svg { stroke: #ef4444; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; max-width: 520px; margin: 20px auto; padding: 10px; }
    .cell {
      width: 100%; aspect-ratio: 1 / 1; border-radius: 16px;
      background: #f5f3eb; border: 2px solid #e5e2d9;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s, transform 0.15s;
      overflow: hidden; padding: 4px;
    }
    .cell:hover { background: #eef2ff; transform: scale(1.03); }
    .cell-text { font-size: clamp(7px, 1.8vw, 15px); line-height: 1.2; text-align: center; word-break: break-word; padding: 2px; }
    .cell input { width: 90%; border: none; text-align: center; outline: none; font-size: 15px; background: transparent; }
    .state-green { background: #dcfce7 !important; color: #166534; }
    .state-red   { background: #fee2e2 !important; color: #991b1b; }
    .state-bingo { background: #16a34a !important; color: #ffffff; box-shadow: 0 0 0 3px #15803d; }
    #konfetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; display: none; }
    .progress-wrap { max-width: 520px; margin: 0 auto 4px auto; padding: 0 10px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 13px; color: #555; margin-bottom: 6px; }
    .progress-track { background: #e2e8f0; border-radius: 999px; height: 12px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 999px; background: #4ade80; transition: width 0.3s ease; }
    .pdf-header { display: none; }
    .pdf-footer { display: none; }
    @media print {
      @page { size: A4 portrait; margin: 15mm; }
      body { background: white; margin: 0; }
      #overviewView, #editBoard, .no-print { display: none !important; }
      #viewBoard { display: block !important; }
      .pdf-header { display: flex !important; justify-content: space-between; align-items: flex-end; margin-bottom: 5mm; border-bottom: 1px solid #ccc; padding-bottom: 3mm; }
      .pdf-header-title { font-size: 22pt; font-weight: bold; color: #111; }
      .pdf-header-year { font-size: 14pt; color: #555; }
      .pdf-footer { display: block !important; text-align: center; margin-top: 4mm; border-top: 1px solid #ccc; padding-top: 3mm; font-size: 10pt; color: #555; font-style: italic; page-break-before: avoid; page-break-inside: avoid; }
      .progress-wrap { max-width: 100%; margin-bottom: 4mm; }
      .progress-label { font-size: 10pt; color: #333; }
      .progress-track { height: 8px; background: #e2e8f0; border-radius: 4px; }
      .progress-fill { border-radius: 4px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .grid { display: grid !important; grid-template-columns: repeat(5, 1fr); gap: 4mm; max-width: 100%; margin: 0 auto; padding: 0; }
      .cell { aspect-ratio: 1 / 1; border-radius: 8px; border: 1px solid #ddd; background: #f9f9f9; display: flex; align-items: center; justify-content: center; padding: 4px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .cell-text { font-size: 7pt; }
      .state-green { background: #dcfce7 !important; color: #166534 !important; border-color: #86efac !important; }
      .state-red   { background: #fee2e2 !important; color: #991b1b !important; border-color: #fca5a5 !important; }
      .state-bingo { background: #16a34a !important; color: #fff !important; border-color: #15803d !important; }
      button { display: none !important; }
    }
  </style>
</head>
<body>

<canvas id="konfetti-canvas"></canvas>
<h1>BingoFriends</h1>

<div id="overviewView" class="view active">
  <label for="yearSelect" style="display:none">Jahr</label>
  <select id="yearSelect"></select>
  <button onclick="createBoard()">Neues Board</button>
  <div class="board-list">
    <h3>Meine Boards</h3>
    <div id="boards"></div>
  </div>
</div>

<div id="viewBoard" class="view">
  <div class="no-print">
    <button onclick="back()">Zur Übersicht</button>
    <button onclick="openEdit(currentBoardId)">Bearbeiten</button>
    <button onclick="printBoard()">PDF</button>
  </div>
  <div class="pdf-header">
    <div class="pdf-header-title" id="pdfTitle">BingoFriends</div>
    <div class="pdf-header-year" id="pdfYear"></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-label">
      <span>Fortschritt</span>
      <span id="progressText">0 %</span>
    </div>
    <div class="progress-track">
      <div id="progressFill" class="progress-fill" style="width: 0%"></div>
    </div>
  </div>
  <div id="viewGrid" class="grid"></div>
  <div class="pdf-footer">For my Friends</div>
</div>

<div id="editBoard" class="view">
  <label for="editName" style="display:none">Board-Name</label>
  <input id="editName" type="text" placeholder="Board-Name" />
  <br/>
  <button onclick="back()">Zur Übersicht</button>
  <button onclick="saveAndBack()">Speichern</button>
  <div id="editGrid" class="grid"></div>
</div>

<script>
  let board = [];
  let currentBoardId = null;
  let saveTimeout = null;
  let lastBingoCount = 0;

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(err => console.warn("SW Fehler:", err));
    });
  }

  function launchKonfetti() {
    const canvas = document.getElementById("konfetti-canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    canvas.style.display = "block";
    const colors = ["#4ade80","#fbbf24","#f87171","#60a5fa","#a78bfa","#fb923c"];
    const pieces = Array.from({length: 130}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * -canvas.height * 0.5,
      w: 8 + Math.random() * 8,
      h: 5 + Math.random() * 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 7,
      vy: 2.5 + Math.random() * 3,
      vx: (Math.random() - 0.5) * 2.5
    }));
    let frame;
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = false;
      pieces.forEach(p => {
        p.y += p.vy; p.x += p.vx; p.rot += p.rotSpeed;
        if (p.y < canvas.height + 20) alive = true;
        ctx.save();
        ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (alive) { frame = requestAnimationFrame(draw); }
      else { canvas.style.display = "none"; ctx.clearRect(0, 0, canvas.width, canvas.height); }
    }
    cancelAnimationFrame(frame);
    draw();
    setTimeout(() => { cancelAnimationFrame(frame); canvas.style.display = "none"; }, 3500);
  }

  function getBingoLines() {
    const lines = [];
    for (let r = 0; r < 5; r++) lines.push([r*5, r*5+1, r*5+2, r*5+3, r*5+4]);
    for (let c = 0; c < 5; c++) lines.push([c, c+5, c+10, c+15, c+20]);
    lines.push([0, 6, 12, 18, 24]);
    lines.push([4, 8, 12, 16, 20]);
    return lines;
  }

  function checkBingo() {
    const lines = getBingoLines();
    const bingoIndices = new Set();
    lines.forEach(line => {
      if (line.every(i => board[i].state === 1)) line.forEach(i => bingoIndices.add(i));
    });
    return bingoIndices;
  }

  function countBingoLines() {
    return getBingoLines().filter(line => line.every(i => board[i].state === 1)).length;
  }

  function getBoards() { return JSON.parse(localStorage.getItem("bingoBoards")) || {}; }
  function setBoards(b) { localStorage.setItem("bingoBoards", JSON.stringify(b)); }

  function initYears() {
    const sel = document.getElementById("yearSelect");
    const y = new Date().getFullYear();
    for (let i = 0; i <= 5; i++) {
      const o = document.createElement("option");
      o.value = y + i; o.textContent = y + i;
      sel.appendChild(o);
    }
  }

  function show(v) {
    document.querySelectorAll(".view").forEach(x => x.classList.remove("active"));
    document.getElementById(v).classList.add("active");
  }

  function updateProgress() {
    const total = board.length;
    const checked = board.filter(c => c.state === 1).length;
    const pct = total > 0 ? Math.round((checked / total) * 100) : 0;
    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("progressText").textContent = pct + " %";
  }

  function printBoard() {
    const b = getBoards()[currentBoardId];
    document.getElementById("pdfTitle").textContent = b.name;
    document.getElementById("pdfYear").textContent = "Jahr " + b.year;
    window.print();
  }

  function createBoard() {
    const year = document.getElementById("yearSelect").value;
    board = Array.from({ length: 25 }, () => ({ text: "", state: 0 }));
    board[12].text = year;
    currentBoardId = Date.now().toString();
    const boards = getBoards();
    boards[currentBoardId] = { name: "Ohne Name", year, data: board };
    setBoards(boards);
    openEdit(currentBoardId);
  }

  function save() {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
      const boards = getBoards();
      const existing = boards[currentBoardId] || {};
      const name = document.getElementById("editName")?.value.trim() || existing.name || "Ohne Name";
      const year = existing.year || document.getElementById("yearSelect").value;
      boards[currentBoardId] = { name, year, data: board };
      setBoards(boards);
      renderList();
    }, 300);
  }

  function renderList() {
    const el = document.getElementById("boards");
    el.innerHTML = "";
    const boards = getBoards();
    Object.keys(boards).forEach(id => {
      const b = boards[id];
      const item = document.createElement("div");
      item.className = "board-item";
      item.onclick = () => openView(id);
      const title = document.createElement("div");
      title.textContent = `${b.name} (${b.year})`;
      const actions = document.createElement("div");
      actions.className = "board-actions";
      const viewBtn = document.createElement("button");
      viewBtn.className = "icon-btn view-btn";
      viewBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
      viewBtn.onclick = e => { e.stopPropagation(); openView(id); };
      const editBtn = document.createElement("button");
      editBtn.className = "icon-btn edit-btn";
      editBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg>`;
      editBtn.onclick = e => { e.stopPropagation(); openEdit(id); };
      const delBtn = document.createElement("button");
      delBtn.className = "icon-btn delete-btn";
      delBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>`;
      delBtn.onclick = e => {
        e.stopPropagation();
        if (!confirm(`"${b.name}" wirklich loeschen?`)) return;
        const boards = getBoards();
        delete boards[id];
        setBoards(boards);
        renderList();
      };
      actions.append(viewBtn, editBtn, delBtn);
      item.append(title, actions);
      el.appendChild(item);
    });
  }

  function openView(id) {
    currentBoardId = id;
    const data = getBoards()[id].data;
    board = data.map(c => ({ text: c.text, state: c.state !== undefined ? c.state : (c.checked ? 1 : 0) }));
    lastBingoCount = 0;
    renderView();
    show("viewBoard");
  }

  function renderView() {
    const grid = document.getElementById("viewGrid");
    grid.innerHTML = "";
    const bingoIndices = checkBingo();
    const hasBingo = bingoIndices.size > 0;
    const bingoCount = countBingoLines();
    if (bingoCount > lastBingoCount) launchKonfetti();
    lastBingoCount = hasBingo ? bingoCount : 0;
    board.forEach((c, i) => {
      const d = document.createElement("div");
      d.className = "cell";
      if (c.state === 1 && bingoIndices.has(i)) d.classList.add("state-bingo");
      else if (c.state === 1) d.classList.add("state-green");
      else if (c.state === 2) d.classList.add("state-red");
      const span = document.createElement("span");
      span.className = "cell-text";
      span.textContent = c.text;
      d.appendChild(span);
      d.onclick = () => { board[i].state = (board[i].state + 1) % 3; save(); renderView(); };
      grid.appendChild(d);
    });
    updateProgress();
  }

  function openEdit(id) {
    const boards = getBoards();
    currentBoardId = id;
    board = boards[id].data.map(c => ({ text: c.text, state: c.state !== undefined ? c.state : (c.checked ? 1 : 0) }));
    document.getElementById("editName").value = boards[id].name;
    renderEdit();
    show("editBoard");
  }

  function renderEdit() {
    const grid = document.getElementById("editGrid");
    grid.innerHTML = "";
    board.forEach((c, i) => {
      const d = document.createElement("div");
      d.className = "cell";
      const input = document.createElement("input");
      input.value = c.text;
      input.autocomplete = "off";
      input.oninput = () => { board[i].text = input.value; save(); };
      d.appendChild(input);
      grid.appendChild(d);
    });
  }

  function back() { clearTimeout(saveTimeout); save(); show("overviewView"); renderList(); }
  function saveAndBack() { clearTimeout(saveTimeout); save(); show("overviewView"); renderList(); }

  initYears();
  renderList();
</script>

</body>
</html>
